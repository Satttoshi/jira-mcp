[project]
name = "jira-mcp"
version = "0.1.0"
description = "Read-only Jira & Confluence MCP server for Claude Code"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.7",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.16.4",
]

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

# Flat layout: the package lives at ./jira_mcp, not ./src/jira_mcp.
[tool.uv.build-backend]
module-root = ""
module-name = "jira_mcp"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["jira_mcp", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
